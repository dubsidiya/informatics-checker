<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Проверяльщик решений</title>
  <link rel="stylesheet" href="/static/style.css?v=20260917b">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="eyebrow">Информатика · Python</p>
        <h1>Проверяльщик решений</h1>
      </div>
      <div class="top-tools">
        <label class="name-field">
          <span>Имя ученика</span>
          <input id="student" type="text" maxlength="80" placeholder="Как подписать работу" autocomplete="name">
        </label>
        <a class="ghost-link" href="/teacher">Кабинет учителя</a>
      </div>
    </header>

    <div class="filters">
      <div>
        <p class="filter-label">Тема</p>
        <div id="topic-filters" class="chips"></div>
      </div>
      <div>
        <p class="filter-label">Уровень</p>
        <div id="level-filters" class="chips"></div>
      </div>
    </div>

    <div class="layout">
      <aside class="panel tasks">
        <div class="tasks-head">
          <h2>Задачи</h2>
          <p id="task-count" class="task-count"></p>
        </div>
        <input id="task-search" class="task-search" type="search" placeholder="Найти задачу" autocomplete="off">
        <label class="quiet-check"><input id="hide-solved" type="checkbox"> Скрыть сданные</label>
        <nav id="task-list" class="task-list"></nav>
      </aside>

      <section class="panel brief">
        <p class="level" id="level"></p>
        <h2 id="title">Загрузка…</h2>
        <p id="statement"></p>
        <div id="file-box" class="file-box hidden"></div>
        <div class="meta">
          <div>
            <h3>Ввод</h3>
            <p id="input-format"></p>
          </div>
          <div>
            <h3>Вывод</h3>
            <p id="output-format"></p>
          </div>
        </div>
        <h3>Примеры</h3>
        <div id="examples" class="examples"></div>
      </section>

      <section class="panel editor-wrap">
        <div class="editor-bar">
          <h2>Твой код</h2>
          <div class="editor-actions">
            <button id="editor-full" type="button" class="ghost-btn" title="На весь экран">На весь экран</button>
            <button id="run" type="button">Проверить</button>
          </div>
        </div>
        <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <div class="editor-status" id="editor-status">
          <span id="editor-cursor">стр. 1, кол. 1</span>
          <span id="editor-sig" class="editor-sig"></span>
          <span class="editor-meta">Python 3 · UTF-8 · отступ 4</span>
        </div>
        <details class="editor-keys" id="editor-keys">
          <summary>Горячие клавиши как в PyCharm</summary>
          <ul></ul>
        </details>
      </section>
    </div>

    <section id="result" class="panel result hidden"></section>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/indent-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/match-highlighter.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/scroll/scrollpastend.min.js"></script>
  <script src="/static/app.js?v=20260917b"></script>
</body>
</html>
